function showErr(msg) {
  var b = document.getElementById('boot');
  if (b) {
    b.style.color = '#B3261E'; b.style.textAlign = 'left';
    b.style.alignItems = 'flex-start'; b.style.fontSize = '12px';
    b.innerHTML = 'ERREUR<br><br>' + String(msg).replace(/\n/g, '<br>');
  }
}
window.onerror = function (msg, file, line) {
  showErr(msg + '\n\n' + (file || '') + '\nligne ' + (line || '?'));
};
setTimeout(function () {
  var b = document.getElementById('boot');
  if (b && b.innerHTML.indexOf('ERREUR') === -1) {
    showErr('Rien apres 25 s.\n\nReact : ' + (window.React ? 'OK' : 'ABSENT')
      + '\nReactDOM : ' + (window.ReactDOM ? 'OK' : 'ABSENT')
      + '\nImages : ' + (window.IMG ? Object.keys(window.IMG).length + ' OK' : 'ABSENT'));
