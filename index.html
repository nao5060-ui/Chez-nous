/* Silhouette calquée sur la mascotte : vraie goutte, pointe en haut
   légèrement inclinée, bras aux hanches, deux jambes. */
/* La mascotte est une vraie image, declinee en huit couleurs.
   DROP_KEY fait le lien entre une couleur de la palette et sa goutte. */
const DROP_KEY = {
  "#00B2A9": "turquoise", "#6C3FD4": "violet", "#FF7A1A": "orange",
  "#E8467C": "rose", "#2F80ED": "bleu", "#2FAF5A": "vert",
  "#F2B705": "jaune", "#64748B": "gris",
};

function Goutte({ color = C.turquoise, size = 40 }) {
  const key = DROP_KEY[color] || "turquoise";
  return (
    <img src={DROPS_IMG[key]} alt="" width={size} height={size}
      style={{ display: "block", objectFit: "contain" }} />
  );
}

function Avatar({ a, size = 38 }) {
  const s = { width: size, height: size };
  if (!a) return <div className="rounded-full" style={{ ...s, background: C.grisF }} />;
  if (a.type === "photo")
    return <img src={a.value} alt="" className="rounded-full object-cover" style={s} />;
  if (a.type === "drop")
    return (
      <div className="flex items-center justify-center rounded-full" style={{ ...s, background: C.gris }}>
        <Goutte color={a.value} size={size * 0.62} />
      </div>
    );
  return (
    <div className="flex items-center justify-center rounded-full" style={{ ...s, background: C.gris, fontSize: size * 0.58 }}>
      {a.value}
    </div>
  );
}

  }, []);

  useEffect(() => {
    (async () => {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        const r = raw ? { value: raw } : null;
        if (r && r.value) {
          const d = JSON.parse(r.value);
          setLang(d.lang || "fr");
          setMembers(d.members || []);
          setTasks(d.tasks?.length ? d.tasks : DEFAULT_TASKS);
          setLog(d.log || []);
          setRewards(d.rewards || []);
          setActiveId(d.members?.[0]?.id || null);
        }
      } catch (e) {}
      /* les médias vivent dans leur propre entrée : ils sont lourds
         et n'ont pas à être réécrits à chaque coche de tâche */
      try {
        const mraw = localStorage.getItem(MEDIA_KEY);
        const m = mraw ? { value: mraw } : null;
        if (m && m.value) setMedia(JSON.parse(m.value));
      } catch (e) {}
      setReady(true);
    })();
  }, []);

  useEffect(() => {
    if (!ready) return;
    (async () => {
      try { localStorage.setItem(STORE_KEY, JSON.stringify({ lang, members, tasks, log, rewards })); }
      catch (e) { setErr(t.errorSave); setTimeout(() => setErr(null), 2500); }
    })();
  }, [lang, members, tasks, log, rewards, ready]);

      try { localStorage.setItem(MEDIA_KEY, JSON.stringify(media)); }
      catch (e) { setErr(t.errorFull); setTimeout(() => setErr(null), 3500); }
    })();
  }, [media, ready]);

  const ws = weekStart(), ds = startOfDay();

  const dayLog = useMemo(() => log.filter((e) => e.ts >= ds), [log, ds]);

  const scores = useMemo(() => {
    const m = {};
    members.forEach((p) => (m[p.id] = 0));
    weekLog.forEach((e) => { if (m[e.memberId] != null) m[e.memberId] += e.points; });

  const momentsOf = (task) => (task.moments && task.moments.length ? task.moments : ["any"]);
  const hit = (e, task, mom) => e.taskId === task.id && (!mom || (e.moment || "any") === mom);
  const doneBy = (task, mid, mom) => scopeLog(task).some((e) => hit(e, task, mom) && e.memberId === mid);
  const assignOf = (task) => task.assign || "house";
  const isDone = (task, mom) =>
    assignOf(task) === "all"
      ? (active ? doneBy(task, active.id, mom) : false)
      : scopeLog(task).some((e) => hit(e, task, mom));
  const doneCount = (task, mom) => members.filter((m) => doneBy(task, m.id, mom)).length;
  /* une tâche est visible pour la personne active si elle est commune
     au foyer, imposée à tous, ou attribuée à cette personne */
  const visibleFor = (task, mid) => {
    const a = assignOf(task);
    return a === "house" || a === "all" || a === mid;
  };
  const assignLabel = (task) => {
    const a = assignOf(task);
    if (a === "house") return t.forHouse;
    if (a === "all") return t.forAll;
    return members.find((m) => m.id === a)?.name || t.forHouse;
  };

  /* une récompense n'existe que si tout le foyer l'a validée */
  const validRewards = rewards.filter((r) =>
    members.length > 0 && members.every((m) => (r.ok || []).includes(m.id)));

  function claimReward(p, r) {
    setLog((l) => [...l, {
      id: uid(), taskId: "__reward__", rewardLabel: r.label,
      memberId: p.id, points: -r.cost, ts: Date.now(), moment: "any",
    }]);
    setBurst({ id: uid(), color: C.orange, variant: "dance", points: -r.cost });
    setTimeout(() => setBurst(null), 1300);
  }

  const today = todayIdx();
  const forDay = (d) => tasks.filter((k) => k.freq === "daily" || (k.freq === "days" && (k.days || []).includes(d)));
  const todayTasks = forDay(today).filter((k) => visibleFor(k, active?.id));
  const byMoment = (m) => todayTasks.filter((k) => momentsOf(k).includes(m));
  const weekly = tasks.filter((k) => k.freq === "weekly" && visibleFor(k, active?.id));

  /* planning : vue de tout le foyer, ou d'une personne */
  const planFilter = (task) => (planWho === "all" ? true : visibleFor(task, planWho));
  const planFor = (d) => forDay(d).filter(planFilter);
  const planWeekly = () => tasks.filter((k) => k.freq === "weekly" && planFilter(k));
  /* une tâche peut porter des médias perso ; le premier sert de vignette */
  const mediaOf = (task) => (task.media || []).map((id) => media[id]).filter(Boolean);
  const src = (task) => {
    const m = mediaOf(task).find((x) => x.type === "image");
    return m ? m.src : (IMG[task.img] || IMG.custom);
  };
  const poster = (task) => {
    const m = mediaOf(task)[0];
    if (m && m.type === "image") return m.src;
    return IMG[task.img] || IMG.custom;
  };

  async function pickPhoto(e) {
    const f = e.target.files?.[0];
    if (!f) return;
    try {
      const url = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = rej;
        r.readAsDataURL(f);
      });
      const im = new Image();
      im.onload = () => {
        const s = 96;
        const cv = document.createElement("canvas");
        cv.width = s; cv.height = s;
        const ctx = cv.getContext("2d");
        const m = Math.min(im.width, im.height);
        ctx.drawImage(im, (im.width - m) / 2, (im.height - m) / 2, m, m, 0, 0, s, s);
        setDraftAvatar({ type: "photo", value: cv.toDataURL("image/jpeg", 0.72) });
      };
      im.src = url;
    } catch (e2) { setErr(t.errorSave); }
  }

  const readFile = (f) => new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(f);
  });

  /* photos redimensionnées à 720 px : largement assez pour le plein
     écran, et vingt fois plus léger qu'une photo brute de téléphone */
  const shrink = (dataUrl) => new Promise((res) => {
    const im = new Image();
    im.onload = () => {
      const max = 720;
      const sc = Math.min(1, max / Math.max(im.width, im.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(im.width * sc);
      cv.height = Math.round(im.height * sc);
      cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
      res(cv.toDataURL("image/jpeg", 0.78));
    };
    im.onerror = () => res(dataUrl);
    im.src = dataUrl;
  });

  async function addMedia(e) {
    const files = Array.from(e.target.files || []);
    const taskId = mediaFor;
    e.target.value = "";
    if (!files.length || !taskId) return;

    const added = [];
    for (const f of files) {
      try {
        if (f.type.startsWith("video/")) {
          if (f.size > MAX_VIDEO) { setErr(t.videoTooBig); setTimeout(() => setErr(null), 4000); continue; }
          const src = await readFile(f);
          const id = uid();
          added.push([id, { type: "video", src }]);
        } else if (f.type.startsWith("image/")) {
          const raw = await readFile(f);
          const small = await shrink(raw);
          const id = uid();
          added.push([id, { type: "image", src: small }]);
        }
      } catch (e2) { /* fichier illisible : on passe au suivant */ }
    }
    if (!added.length) return;

    const next = { ...media };
    added.forEach(([id, m]) => { next[id] = m; });
    const weight = JSON.stringify(next).length;
    if (weight > MAX_TOTAL) { setErr(t.errorFull); setTimeout(() => setErr(null), 4000); return; }

    setMedia(next);
    setTasks((ts) => ts.map((x) => x.id === taskId
      ? { ...x, media: [...(x.media || []), ...added.map(([id]) => id)] } : x));
  }

  function removeMedia(taskId, id) {
    setTasks((ts) => ts.map((x) => x.id === taskId
      ? { ...x, media: (x.media || []).filter((y) => y !== id) } : x));
    setMedia((m) => { const n = { ...m }; delete n[id]; return n; });
  }

  function addMember() {
    const n = draftName.trim();
    if (!n) return;
    const p = { id: uid(), name: n, avatar: draftAvatar, kind: draftKind };
    setMembers((m) => [...m, p]);
    setActiveId((a) => a || p.id);
    setDraftName("");
    setDraftAvatar({ type: "drop", value: DROPS[(members.length + 1) % DROPS.length] });
  }

  function logTask(task, mom = null) {
    if (!active) return;
    const entry = { id: uid(), taskId: task.id, memberId: active.id, points: task.points, ts: Date.now(), moment: mom || "any" };
    setLog((l) => [...l, entry]);
    const variants = ["spin", "dance", "shine"];
    setBurst({
      id: entry.id,
      color: ACCENTS[tasks.findIndex((x) => x.id === task.id) % 3],
      variant: variants[Math.floor(Math.random() * variants.length)],
      points: task.points,
    });
    setTimeout(() => setBurst((b) => (b?.id === entry.id ? null : b)), 1300);
  }

  if (!ready)
    return <div className="flex min-h-screen items-center justify-center" style={{ background: C.gris, color: C.encreDoux }}>{UI.fr.loading}</div>;

  const needsSetup = members.length === 0;

  const Titre = ({ children, color }) => (
    <p className="mb-2 text-[11px] font-extrabold uppercase tracking-[0.14em]" style={{ color: color || C.encreDoux }}>
      {children}
    </p>
  );

  /* étiquette blanche : image à gauche, libellé à côté */
  const rowEl = (task, i, mode = "log", mom = null) => {
    const done = isDone(task, mom);
    const col = ACCENTS[i % 3];
    const dx = swipe && swipe.id === task.id ? swipe.dx : 0;
    const armed = dx < -90;
    return (
      <div className="relative overflow-hidden rounded-2xl" style={{ background: C.orange }}>
        {/* révélé par le glissement */}
        <div className="pointer-events-none absolute inset-y-0 end-0 flex items-center gap-2 pe-5"
          style={{ color: "#fff" }}>
          <span className="text-lg">🗑</span>
          <span className="text-xs font-extrabold">{t.remove}</span>
        </div>

        <div
          onTouchStart={(e) => setSwipe({ id: task.id, x0: e.touches[0].clientX, dx: 0 })}
          onTouchMove={(e) => {
            if (!swipe || swipe.id !== task.id) return;
            const d = e.touches[0].clientX - swipe.x0;
            setSwipe({ ...swipe, dx: Math.max(-150, Math.min(0, rtl ? -d : d)) });
          }}
          onTouchEnd={() => {
            if (swipe && swipe.id === task.id && swipe.dx < -90) {
              setTasks((ts) => ts.filter((x) => x.id !== task.id));
              if (openTask === task.id) setOpenTask(null);
            }
            setSwipe(null);
          }}
          className="flex items-center gap-3 rounded-2xl p-2"
          style={{
            background: C.blanc,
            transform: `translateX(${rtl ? -dx : dx}px)`,
            transition: swipe && swipe.id === task.id ? "none" : "transform 200ms ease-out",
            boxShadow: armed ? `0 0 0 2px ${C.orange}` : "none",
          }}>
        <button onClick={() => { setZoomIdx(0); setZoom(task); }}
          className="flex h-12 w-12 shrink-0 items-center justify-center overflow-hidden rounded-xl transition active:scale-95"
          style={{ background: C.gris }}>
          <img src={src(task)} alt="" className="h-full w-full object-cover" style={{ opacity: done && mode === "log" ? 0.4 : 1 }} />
        </button>

        {editing === task.id ? (
          <input autoFocus value={editVal} onChange={(e) => setEditVal(e.target.value)}
            onBlur={() => {
              const v = editVal.trim();
              if (v) setTasks((ts) => ts.map((x) => (x.id === task.id ? { ...x, label: v } : x)));
              setEditing(null);
            }}
            className="flex-1 rounded-xl px-3 py-2 text-sm font-bold outline-none"
            style={{ background: C.gris }} />
        ) : (
          <div className="flex-1">
            <span className="block text-[15px] font-bold leading-tight"
              style={{ color: done && mode === "log" ? C.encreDoux : C.encre }}>
              {label(task)}
            </span>
            <span className="text-[11px] font-bold" style={{ color: C.encreDoux }}>
              {assignLabel(task)}
              {assignOf(task) === "all" && members.length > 0 && ` · ${doneCount(task, mom)}/${members.length}`}
            </span>
          </div>
        )}

        {mode === "log" ? (
          done ? (
            <span className="rounded-full px-3 py-1.5 text-xs font-extrabold" style={{ background: C.gris, color: C.encreDoux }}>✓</span>
          ) : (
            <button onClick={() => logTask(task, mom)}
              className="rounded-full px-3.5 py-1.5 text-xs font-extrabold transition active:scale-95"
              style={{ background: col, color: "#fff" }}>
              +{task.points}
            </button>
          )
        ) : (
          <button onClick={() => setOpenTask(openTask === task.id ? null : task.id)}
            className="rounded-full px-3 py-1.5 text-xs font-extrabold"
            style={{ background: openTask === task.id ? C.violet : C.gris, color: openTask === task.id ? "#fff" : C.encreDoux }}>
            {openTask === task.id ? "▲" : "✎"}
          </button>
        )}
        </div>
      </div>
    );
  };

  const Section = ({ title, color, items, off = 0, mom = null }) =>
    items.length === 0 ? null : (
      <section className="mt-5">
        <Titre color={color}>{title}</Titre>
        <div className="flex flex-col gap-2">
          {items.map((task, i) => <React.Fragment key={task.id}>{rowEl(task, i + off, "log", mom)}</React.Fragment>)}
        </div>
      </section>
    );

  /* panneau d'édition : tout se règle ici, y compris la récurrence
     et la personne à qui la tâche revient */
  const editorEl = (task) => {
    const up = (patch) => setTasks((ts) => ts.map((x) => (x.id === task.id ? { ...x, ...patch } : x)));
    const Chip = ({ on, color, onClick, children, flex = true }) => (
      <button onClick={onClick}
        className={`${flex ? "flex-1 " : ""}rounded-xl px-2 py-1.5 text-[11px] font-extrabold`}
        style={{ background: on ? color : C.gris, color: on ? "#fff" : C.encreDoux }}>
        {children}
      </button>
    );
    return (
      <div className="rounded-2xl p-3" style={{ background: C.blanc, boxShadow: `inset 0 0 0 2px ${C.grisF}` }}>
        <input value={label(task)} onChange={(e) => up({ label: e.target.value })}
          className="w-full rounded-xl px-3 py-2.5 text-sm font-bold outline-none" style={{ background: C.gris }} />

        {/* le choix du dessin ne concerne que les tâches créées soi-même :
           celles du catalogue ont déjà la bonne illustration */}
        {!CATALOG.some((c) => c.id === task.id) && (
          <>
            <p className="mb-1.5 mt-3 text-[10px] font-extrabold uppercase tracking-widest" style={{ color: C.encreDoux }}>{t.image}</p>
            <div className="grid grid-cols-4 gap-1.5">
              {LIB.map((k) => (
                <button key={k} onClick={() => up({ img: k })} className="overflow-hidden rounded-lg"
                  style={{ background: C.gris, outline: task.img === k ? `3px solid ${C.turquoise}` : "none" }}>
                  <img src={IMG[k]} alt="" className="block w-full" />
                </button>
              ))}
            </div>
          </>
        )}

        <div className="mb-1.5 mt-3 flex items-center justify-between">
          <p className="text-[10px] font-extrabold uppercase tracking-widest" style={{ color: C.encreDoux }}>
            {t.myMedia}
          </p>
          <button onClick={() => { setMediaFor(task.id); setTimeout(() => mediaRef.current?.click(), 0); }}
            className="rounded-full px-3 py-1 text-[11px] font-extrabold"
            style={{ background: C.violet, color: "#fff" }}>
            + {t.addMedia}
          </button>
        </div>

        {mediaOf(task).length === 0 ? (
          <p className="text-[11px]" style={{ color: C.encreDoux }}>{t.mediaHint}</p>
        ) : (
          <div className="flex gap-2 overflow-x-auto pb-1">
            {(task.media || []).map((id) => {
              const m = media[id];
              if (!m) return null;
              return (
                <div key={id} className="relative shrink-0">
                  {m.type === "video" ? (
                    <video src={m.src} className="h-16 w-16 rounded-lg object-cover"
                      style={{ background: C.gris }} muted playsInline />
                  ) : (
                    <img src={m.src} alt="" className="h-16 w-16 rounded-lg object-cover"
                      style={{ background: C.gris }} />
                  )}
                  {m.type === "video" && (
                    <span className="pointer-events-none absolute bottom-0.5 start-1 text-[10px]">▶</span>
                  )}
                  <button onClick={() => removeMedia(task.id, id)}
                    className="absolute -end-1 -top-1 flex h-5 w-5 items-center justify-center rounded-full text-xs font-black"
                    style={{ background: C.orange, color: "#fff" }}>
                    ×
                  </button>
                </div>
              );
            })}
          </div>
        )}

        <p className="mb-1.5 mt-3 text-[10px] font-extrabold uppercase tracking-widest" style={{ color: C.encreDoux }}>{t.assign}</p>
        <div className="flex flex-wrap gap-1.5">
          <Chip flex={false} on={assignOf(task) === "house"} color={C.turquoise} onClick={() => up({ assign: "house" })}>{t.forHouse}</Chip>
          <Chip flex={false} on={assignOf(task) === "all"} color={C.violet} onClick={() => up({ assign: "all" })}>{t.forAll}</Chip>
          {members.map((m, i) => (
            <Chip key={m.id} flex={false} on={assignOf(task) === m.id} color={ACCENTS[i % 3]} onClick={() => up({ assign: m.id })}>
              {m.name}
            </Chip>
          ))}
        </div>

        <p className="mb-1.5 mt-3 text-[10px] font-extrabold uppercase tracking-widest" style={{ color: C.encreDoux }}>{t.recurrence}</p>
        <div className="flex gap-1.5">
          {[["daily", t.freqDaily], ["weekly", t.freqWeekly], ["days", t.freqDays]].map(([k, lb]) => (
            <Chip key={k} on={task.freq === k} color={C.violet} onClick={() => up({ freq: k })}>{lb}</Chip>
          ))}
        </div>

        {task.freq === "days" && (
          <div className="mt-1.5 flex gap-1">
            {t.days.map((d, i) => {
              const on = (task.days || []).includes(i);
              return (
                <button key={i}
                  onClick={() => up({ days: on ? task.days.filter((y) => y !== i) : [...(task.days || []), i] })}
                  className="h-9 flex-1 rounded-lg text-xs font-black"
                  style={{ background: on ? C.orange : C.gris, color: on ? "#fff" : C.encreDoux }}>
                  {d}
                </button>
              );
            })}
          </div>
        )}

        {task.freq !== "weekly" && (
          <>
            <p className="mb-1.5 mt-3 text-[10px] font-extrabold uppercase tracking-widest" style={{ color: C.encreDoux }}>{t.moment}</p>
            <div className="flex gap-1.5">
              {[["morning", t.mMorning], ["any", t.mAny], ["evening", t.mEvening]].map(([k, lb]) => {
                const cur = momentsOf(task);
                const on = cur.includes(k);
                return (
                  <Chip key={k} on={on} color={C.turquoise}
                    onClick={() => {
                      const next = on ? cur.filter((x) => x !== k) : [...cur, k];
                      up({ moments: next.length ? next : ["any"] });
                    }}>{lb}</Chip>
                );
              })}
            </div>
            <p className="mt-1 text-[10px]" style={{ color: C.encreDoux }}>{t.momentHint}</p>
          </>
        )}

        <div className="mt-3 flex items-center gap-2">
          <span className="text-[10px] font-extrabold uppercase tracking-widest" style={{ color: C.encreDoux }}>{t.points}</span>
          <div className="flex flex-1 gap-1">
            {[5, 10, 15, 20].map((v) => (
              <button key={v} onClick={() => up({ points: v })}
                className="flex-1 rounded-lg py-1.5 text-xs font-extrabold"
                style={{ background: task.points === v ? C.encre : C.gris, color: task.points === v ? "#fff" : C.encreDoux }}>
                {v}
              </button>
            ))}
          </div>
          <button onClick={() => { setTasks((ts) => ts.filter((x) => x.id !== task.id)); setOpenTask(null); }}
            className="rounded-lg px-3 py-1.5 text-xs font-extrabold" style={{ background: C.orange, color: "#fff" }}>
            {t.remove}
          </button>
        </div>
      </div>
    );
  };

  return (
    <div dir={rtl ? "rtl" : "ltr"} className="min-h-screen w-full"
      style={{ background: C.gris, color: C.encre, fontFamily: "Assistant, system-ui, sans-serif" }}>
      <style>{CSS}</style>

      <div className="mx-auto w-full max-w-md px-4 pb-28 pt-5">
        <header className="flex items-center justify-between gap-3">
          <div className="flex items-center gap-2">
            <Goutte color={C.turquoise} size={26} />
            <h1 className="text-xl font-black tracking-tight" style={titre}>{t.app}</h1>
          </div>
          <div className="flex gap-1">
            {LANGS.map((l) => (
              <button key={l.id} onClick={() => setLang(l.id)} className="rounded-full px-2.5 py-1 text-xs font-extrabold"
                style={{ background: lang === l.id ? C.turquoise : C.blanc, color: lang === l.id ? "#fff" : C.encreDoux }}>
                {l.label}
              </button>
            ))}
          </div>
        </header>

        {needsSetup ? (
          <section className="mt-8">
            <h2 className="text-xl font-black" style={titre}>{t.setupTitle}</h2>
            <p className="mt-1 text-sm" style={{ color: C.encreDoux }}>{t.setupHint}</p>
            <div className="mt-5 rounded-3xl p-4" style={{ background: C.blanc }}>
              <AvatarPicker />
              <input value={draftName} onChange={(e) => setDraftName(e.target.value)} placeholder={t.name}
                className="mt-3 w-full rounded-2xl px-4 py-3 outline-none" style={{ background: C.gris }} />
              <div className="mt-3 flex gap-2">
                {["child", "adult"].map((k) => (
                  <button key={k} onClick={() => setDraftKind(k)} className="flex-1 rounded-2xl py-2.5 text-sm font-extrabold"
                    style={{ background: draftKind === k ? C.encre : C.gris, color: draftKind === k ? "#fff" : C.encreDoux }}>
                    {k === "child" ? t.child : t.adult}
                  </button>
                ))}
              </div>
              <button onClick={addMember} className="mt-3 w-full rounded-2xl py-3 font-extrabold"
                style={{ background: C.turquoise, color: "#fff" }}>{t.add}</button>
            </div>
          </section>
        ) : (
          <>
            {(tab === "home" || (tab === "tasks" && taskView === "list")) && (
              <div className="mt-4 flex gap-2 overflow-x-auto pb-1">
                {members.map((p, i) => {
                  const on = p.id === active?.id;
                  return (
                    <button key={p.id} onClick={() => setActiveId(p.id)}
                      className="flex shrink-0 items-center gap-2 rounded-full py-1.5 pe-4 ps-1.5 transition"
                      style={{ background: on ? ACCENTS[i % 3] : C.blanc, color: on ? "#fff" : C.encre }}>
                      <Avatar a={p.avatar} size={30} />
                      <span className="text-sm font-extrabold">{p.name}</span>
                    </button>
                  );
                })}
              </div>
            )}

            {/* ===== ACCUEIL ===== */}
            {tab === "home" && (
              <>
                <section className="mt-5">
                  <Titre color={C.violet}>{t.scores}</Titre>
                  <div className="flex flex-col gap-2">
                    {members.map((p, i) => {
                      const v = scores[p.id] || 0;
                      const col = ACCENTS[i % 3];
                      /* la barre vise la prochaine récompense validée par tous,
                         plutôt que le score du meilleur : chacun court après un but */
                      const goal = validRewards.filter((r) => r.cost > v).sort((a, b) => a.cost - b.cost)[0];
                      const reachable = validRewards.filter((r) => r.cost <= v).sort((a, b) => b.cost - a.cost)[0];
                      const max = goal ? goal.cost : Math.max(50, v);
                      return (
                        <div key={p.id} className="rounded-2xl p-3" style={{ background: C.blanc }}>
                          <div className="flex items-center gap-2">
                            <Avatar a={p.avatar} size={34} />
                            <span className="flex-1 font-extrabold">{p.name}</span>
                            <span className="rounded-full px-2.5 py-1 text-xs font-extrabold" style={{ background: col, color: "#fff" }}>
                              {v} {t.points}
                            </span>
                          </div>
                          <div className="mt-2 h-2.5 w-full overflow-hidden rounded-full" style={{ background: C.gris }}>
                            <div className="h-full rounded-full transition-all" style={{ width: `${Math.min(100, (v / max) * 100)}%`, background: col }} />
                          </div>

                          {reachable ? (
                            <button onClick={() => claimReward(p, reachable)}
                              className="mt-2 w-full rounded-xl py-2 text-xs font-extrabold transition active:scale-[.98]"
                              style={{ background: col, color: "#fff" }}>
                              🎁 {reachable.label} · {t.rwClaim}
                            </button>
                          ) : goal ? (
                            <p className="mt-1.5 text-[11px] font-bold" style={{ color: C.encreDoux }}>
                              {t.rwNext} : {goal.label} · {goal.cost - v} {t.points}
                            </p>
                          ) : null}
                        </div>
                      );
                    })}
                  </div>
                </section>

                <Section title={t.morning} color={C.turquoise} items={byMoment("morning")} mom="morning" />
                <Section title={t.anyTime} color={C.encreDoux} items={byMoment("any")} off={1} mom="any" />
                <Section title={t.evening} color={C.violet} items={byMoment("evening")} off={2} mom="evening" />
                <Section title={t.weekTasks} color={C.orange} items={weekly} off={1} />

                {todayTasks.length > 0 && todayTasks.every(isDone) && (
                  <div className="mt-5 rounded-3xl p-5 text-center" style={{ background: C.turquoise, color: "#fff" }}>
                    <p className="text-lg font-black" style={titre}>{t.allDone}</p>
                  </div>
                )}
              </>
            )}

            {/* ===== TÂCHES ===== */}
            {/* deux façons de regarder les mêmes tâches */}
            {tab === "tasks" && (
              <div className="mt-4 flex gap-2 rounded-2xl p-1" style={{ background: C.blanc }}>
                {[["list", t.tasks], ["week", t.plan]].map(([k, lb]) => (
                  <button key={k} onClick={() => setTaskView(k)}
                    className="flex-1 rounded-xl py-2 text-sm font-extrabold transition"
                    style={{ background: taskView === k ? C.turquoise : "transparent", color: taskView === k ? "#fff" : C.encreDoux }}>
                    {lb}
                  </button>
                ))}
              </div>
            )}

            {tab === "tasks" && taskView === "list" && (
              <section className="mt-5">
                {tasks.length === 0 ? (
                  <div className="rounded-3xl p-8 text-center" style={{ background: C.blanc }}>
                    <div className="mx-auto mb-3 w-fit opacity-40"><Goutte color={C.encreDoux} size={54} /></div>
                    <p className="text-sm font-bold" style={{ color: C.encreDoux }}>{t.emptyTasks}</p>
                  </div>
                ) : (
                  <div className="flex flex-col gap-2">
                    {tasks.map((task, i) => (
                      <div key={task.id} className="flex flex-col gap-2">
                        {rowEl(task, i, "edit")}
                        {openTask === task.id && editorEl(task)}
                      </div>
                    ))}
                  </div>
                )}

                {/* le + vit à la fin de la liste */}
                <button onClick={() => setAddMenu(true)}
                  className="mt-3 flex w-full items-center justify-center gap-2 rounded-2xl py-4 transition active:scale-[.99]"
                  style={{ background: C.blanc, border: `2.5px dashed ${C.turquoise}`, color: C.turquoise }}>
                  <span className="text-xl font-black">+</span>
                  <span className="text-sm font-extrabold">{t.addTask}</span>
                </button>
              </section>
            )}

            {/* ===== PLANNING ===== */}
            {tab === "tasks" && taskView === "week" && (
              <section className="mt-5">
                {/* filtre : tout le foyer, ou une personne */}
                <div className="mb-4 flex gap-2 overflow-x-auto pb-1">
                  <button onClick={() => setPlanWho("all")}
                    className="shrink-0 rounded-full px-4 py-2 text-sm font-extrabold"
                    style={{ background: planWho === "all" ? C.violet : C.blanc, color: planWho === "all" ? "#fff" : C.encre }}>
                    {t.everyone}
                  </button>
                  {members.map((p, i) => {
                    const on = planWho === p.id;
                    return (
                      <button key={p.id} onClick={() => setPlanWho(p.id)}
                        className="flex shrink-0 items-center gap-2 rounded-full py-1.5 pe-4 ps-1.5"
                        style={{ background: on ? ACCENTS[i % 3] : C.blanc, color: on ? "#fff" : C.encre }}>
                        <Avatar a={p.avatar} size={28} />
                        <span className="text-sm font-extrabold">{p.name}</span>
                      </button>
                    );
                  })}
                </div>

                <Titre color={C.violet}>{t.week}</Titre>
                <div className="flex gap-1.5">
                  {t.days.map((d, i) => {
                    const on = planDay === i;
                    return (
                      <button key={i} onClick={() => setPlanDay(i)}
                        className="flex flex-1 flex-col items-center gap-1 rounded-2xl py-2"
                        style={{
                          background: on ? C.violet : C.blanc, color: on ? "#fff" : C.encre,
                          outline: i === today && !on ? `2px solid ${C.turquoise}` : "none",
                        }}>
                        <span className="text-xs font-black">{d}</span>
                        <span className="rounded-full px-1.5 text-[10px] font-extrabold"
                          style={{ background: on ? "rgba(255,255,255,.25)" : C.gris, color: on ? "#fff" : C.encreDoux }}>
                          {planFor(i).length}
                        </span>
                      </button>
                    );
                  })}
                </div>

                <p className="mt-4 text-base font-black" style={titre}>{t.dayFull[planDay]}</p>
                <div className="mt-2 flex flex-col gap-2">
                  {planFor(planDay).length === 0 && <p className="text-sm" style={{ color: C.encreDoux }}>{t.noDay}</p>}
                  {planFor(planDay).map((task) => (
                    <div key={task.id} className="flex items-center gap-3 rounded-2xl p-2" style={{ background: C.blanc }}>
                      <button onClick={() => { setZoomIdx(0); setZoom(task); }} className="h-11 w-11 shrink-0 overflow-hidden rounded-xl transition active:scale-95" style={{ background: C.gris }}>
                        <img src={src(task)} alt="" className="h-full w-full object-cover" />
                      </button>
                      <div className="flex-1">
                        <span className="block text-sm font-bold leading-tight">{label(task)}</span>
                        <span className="text-[11px] font-bold" style={{ color: C.encreDoux }}>{assignLabel(task)}</span>
                      </div>
                      <span className="rounded-full px-2 py-1 text-[10px] font-extrabold"
                        style={{ background: C.gris, color: C.encreDoux }}>
                        {momentsOf(task).map((m) => m === "morning" ? t.mMorning : m === "evening" ? t.mEvening : t.mAny).join(" · ")}
                      </span>
                    </div>
                  ))}
                </div>

                {planWeekly().length > 0 && (
                  <div className="mt-6">
                    <Titre color={C.orange}>{t.weekTasks}</Titre>
                    <div className="flex flex-col gap-2">
                      {planWeekly().map((task) => (
                        <div key={task.id} className="flex items-center gap-3 rounded-2xl p-2" style={{ background: C.blanc }}>
                          <button onClick={() => { setZoomIdx(0); setZoom(task); }} className="h-11 w-11 shrink-0 overflow-hidden rounded-xl transition active:scale-95" style={{ background: C.gris }}>
                            <img src={src(task)} alt="" className="h-full w-full object-cover" />
                          </button>
                          <div className="flex-1">
                            <span className="block text-sm font-bold leading-tight">{label(task)}</span>
                            <span className="text-[11px] font-bold" style={{ color: C.encreDoux }}>{assignLabel(task)}</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

              </section>
            )}

            {/* ===== BIBLIOTHÈQUE ===== */}
            {/* ===== RÉGLAGES ===== */}
            {tab === "settings" && (
              <section className="mt-5 flex flex-col gap-6">
                <div>
                  <Titre color={C.turquoise}>{t.people}</Titre>
                  <div className="flex flex-col gap-2">
                    {members.map((p, i) => (
                      <div key={p.id} className="flex items-center gap-3 rounded-2xl p-2.5" style={{ background: C.blanc }}>
                        <Avatar a={p.avatar} size={38} />
                        <span className="flex-1 font-bold">{p.name}</span>
                        <span className="text-xs font-semibold" style={{ color: C.encreDoux }}>
                          {p.kind === "child" ? t.child : t.adult}
                        </span>
                        <button onClick={() => { setMembers((m) => m.filter((x) => x.id !== p.id)); if (activeId === p.id) setActiveId(null); }}
                          className="rounded-full px-2.5 py-1 text-xs font-extrabold" style={{ background: C.gris, color: C.orange }}>×</button>
                      </div>
                    ))}
                  </div>
                  <div className="mt-3 rounded-3xl p-4" style={{ background: C.blanc }}>
                    <AvatarPicker />
                    <input value={draftName} onChange={(e) => setDraftName(e.target.value)} placeholder={t.name}
                      className="mt-3 w-full rounded-2xl px-4 py-3 outline-none" style={{ background: C.gris }} />
                    <div className="mt-2 flex gap-2">
                      {["child", "adult"].map((k) => (
                        <button key={k} onClick={() => setDraftKind(k)} className="flex-1 rounded-2xl py-2 text-sm font-extrabold"
                          style={{ background: draftKind === k ? C.encre : C.gris, color: draftKind === k ? "#fff" : C.encreDoux }}>
                          {k === "child" ? t.child : t.adult}
                        </button>
                      ))}
                    </div>
                    <button onClick={addMember} className="mt-2 w-full rounded-2xl py-2.5 font-extrabold"
                      style={{ background: C.turquoise, color: "#fff" }}>{t.add}</button>
                  </div>
                </div>

                {/* les récompenses se décident à plusieurs :
                   tant que tout le monde n'a pas validé, elle reste en attente */}
                <div>
                  <Titre color={C.orange}>{t.rewards}</Titre>
                  <p className="mb-2 text-[11px]" style={{ color: C.encreDoux }}>{t.rwHint}</p>

                  {rewards.length === 0 ? (
                    <p className="mb-3 text-sm" style={{ color: C.encreDoux }}>{t.rwNone}</p>
                  ) : (
                    <div className="mb-3 flex flex-col gap-2">
                      {rewards.map((r) => {
                        const okAll = members.length > 0 && members.every((m) => (r.ok || []).includes(m.id));
                        const meOk = active ? (r.ok || []).includes(active.id) : false;
                        return (
                          <div key={r.id} className="rounded-2xl p-3" style={{ background: C.blanc }}>
                            <div className="flex items-center gap-2">
                              <span className="flex-1 text-[15px] font-bold">{r.label}</span>
                              <span className="rounded-full px-2.5 py-1 text-xs font-extrabold"
                                style={{ background: okAll ? C.turquoise : C.gris, color: okAll ? "#fff" : C.encreDoux }}>
                                {r.cost} {t.points}
                              </span>
                              <button onClick={() => setRewards((rs) => rs.filter((x) => x.id !== r.id))}
                                className="px-1 text-lg font-black" style={{ color: C.orange }}>×</button>
                            </div>

                            <div className="mt-2 flex items-center gap-2">
                              <span className="flex-1 text-[11px] font-bold"
                                style={{ color: okAll ? C.turquoise : C.encreDoux }}>
                                {okAll ? t.rwReady
                                  : `${(r.ok || []).length}/${members.length} ${t.rwAgreed} · ${t.rwPending}`}
                              </span>
                              {active && (
                                <button
                                  onClick={() => setRewards((rs) => rs.map((x) => x.id !== r.id ? x : {
                                    ...x,
                                    ok: meOk ? (x.ok || []).filter((y) => y !== active.id)
                                             : [...(x.ok || []), active.id],
                                  }))}
                                  className="rounded-full px-3 py-1.5 text-[11px] font-extrabold"
                                  style={{ background: meOk ? C.turquoise : C.gris, color: meOk ? "#fff" : C.encreDoux }}>
                                  {meOk ? "✓" : ""} {t.rwAgree}
                                </button>
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}

                  <div className="rounded-3xl p-3" style={{ background: C.blanc }}>
                    <input value={newRw} onChange={(e) => setNewRw(e.target.value)} placeholder={t.rwName}
                      className="w-full rounded-2xl px-4 py-3 outline-none" style={{ background: C.gris }} />
                    <div className="mt-2 flex items-center gap-2">
                      <span className="text-[10px] font-extrabold uppercase tracking-widest" style={{ color: C.encreDoux }}>
                        {t.rwCost}
                      </span>
                      <div className="flex flex-1 gap-1">
                        {[30, 50, 100, 200].map((v) => (
                          <button key={v} onClick={() => setNewRwCost(v)}
                            className="flex-1 rounded-lg py-1.5 text-xs font-extrabold"
                            style={{ background: newRwCost === v ? C.encre : C.gris, color: newRwCost === v ? "#fff" : C.encreDoux }}>
                            {v}
                          </button>
                        ))}
                      </div>
                    </div>
                    <button onClick={() => {
                      const n = newRw.trim(); if (!n) return;
                      setRewards((rs) => [...rs, {
                        id: uid(), label: n, cost: newRwCost,
                        by: active?.id || null, ok: active ? [active.id] : [],
                      }]);
                      setNewRw("");
                    }} className="mt-2 w-full rounded-2xl py-3 font-extrabold"
                      style={{ background: C.orange, color: "#fff" }}>
                      {t.newReward}
                    </button>
                  </div>
                </div>

                <div>
                  <Titre color={C.violet}>{t.history}</Titre>
                  {weekLog.length === 0 ? (
                    <p className="text-sm" style={{ color: C.encreDoux }}>{t.nothing}</p>
                  ) : (
                    <div className="flex flex-col gap-1.5">
                      {[...weekLog].reverse().slice(0, 15).map((e) => {
                        const p = members.find((x) => x.id === e.memberId);
                        const isRw = e.taskId === "__reward__";
                        const task = tasks.find((x) => x.id === e.taskId);
                        if (!p || (!task && !isRw)) return null;
                        return (
                          <div key={e.id} className="flex items-center gap-2 rounded-xl px-3 py-2 text-sm" style={{ background: C.blanc }}>
                            <span className="flex-1 font-semibold"
                              style={{ color: isRw ? C.orange : C.encre }}>
                              {isRw ? `🎁 ${e.rewardLabel}` : label(task)}
                            </span>
                            <span className="font-bold" style={{ color: C.encreDoux }}>{p.name}</span>
                            <button onClick={() => setLog((l) => l.filter((x) => x.id !== e.id))}
                              className="font-bold underline" style={{ color: C.orange }}>{t.undo}</button>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>

                <button onClick={() => setLog((l) => l.filter((e) => e.ts < ws))}
                  className="rounded-2xl py-3 text-sm font-extrabold" style={{ background: C.orange, color: "#fff" }}>
                  {t.resetWeek}
                </button>
              </section>
            )}
          </>
        )}
      </div>

      {/* animation : la goutte tourne, puis scintille */}
      {burst && (
        <div className="pointer-events-none fixed inset-0 z-30 flex items-center justify-center">
          <div className="relative flex items-center justify-center">
            <span className="ring absolute rounded-full"
              style={{ width: 150, height: 150, border: `6px solid ${burst.color}` }} />
            <span className={`drop-${burst.variant} block`}><Goutte color={burst.color} size={100} /></span>
            <span className="points-up absolute text-3xl font-black"
              style={{ top: -18, color: burst.color, animationDelay: "420ms", fontFamily: "Nunito, sans-serif" }}>
              +{burst.points}
            </span>
            {[
              { x: -74, y: -58, s: 26, d: 620 },
              { x: 70, y: -44, s: 20, d: 700 },
              { x: -50, y: 62, s: 18, d: 760 },
              { x: 62, y: 58, s: 24, d: 660 },
              { x: 0, y: -86, s: 16, d: 820 },
            ].map((p, i) => (
              <span key={i} className="sparkle absolute" style={{
                left: `calc(50% + ${p.x}px)`, top: `calc(50% + ${p.y}px)`,
                animationDelay: `${p.d}ms`, transform: "translate(-50%,-50%)",
              }}>
                <svg width={p.s} height={p.s} viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 0 L14.4 9.6 L24 12 L14.4 14.4 L12 24 L9.6 14.4 L0 12 L9.6 9.6 Z" fill={burst.color} />
                </svg>
              </span>
            ))}
          </div>
        </div>
      )}

      {/* plein écran : photos, vidéos, ou l'illustration par défaut */}
      {zoom && (() => {
        const list = mediaOf(zoom);
        const cur = list[zoomIdx];
        return (
          <div className="fade-in fixed inset-0 z-40 flex items-center justify-center p-6"
            style={{ background: "rgba(16,27,45,.78)" }}
            onClick={() => { setZoom(null); setZoomIdx(0); }}>
            <div className="zoom-in w-full max-w-sm rounded-3xl p-3" style={{ background: C.blanc }}
              onClick={(e) => e.stopPropagation()}>

              {cur && cur.type === "video" ? (
                <video src={cur.src} className="block w-full rounded-2xl" controls autoPlay loop playsInline
                  style={{ background: "#000" }} />
              ) : (
                <img src={cur ? cur.src : (IMG[zoom.img] || IMG.custom)} alt=""
                  className="block w-full rounded-2xl" />
              )}

              {list.length > 1 && (
                <div className="mt-2 flex items-center justify-center gap-3">
                  <button onClick={() => setZoomIdx((n) => (n - 1 + list.length) % list.length)}
                    className="rounded-full px-3 py-1 text-sm font-black"
                    style={{ background: C.gris, color: C.encre }}>‹</button>
                  <span className="text-xs font-extrabold" style={{ color: C.encreDoux }}>
                    {zoomIdx + 1} / {list.length}
                  </span>
                  <button onClick={() => setZoomIdx((n) => (n + 1) % list.length)}
                    className="rounded-full px-3 py-1 text-sm font-black"
                    style={{ background: C.gris, color: C.encre }}>›</button>
                </div>
              )}

              <p className="mt-3 mb-1 text-center text-lg font-black"
                style={{ fontFamily: "Nunito, Assistant, sans-serif" }}>
                {label(zoom)}
              </p>
              <p className="mb-1 text-center text-xs font-bold" style={{ color: C.encreDoux }}>
                {assignLabel(zoom)} · {zoom.points} {t.points}
              </p>
            </div>
          </div>
        );
      })()}

      {/* le + propose : piocher dans la bibliothèque, ou créer soi-même */}
      {addMenu && (
        <div className="fade-in fixed inset-0 z-40 flex items-end justify-center p-4"
          style={{ background: "rgba(16,27,45,.6)" }} onClick={() => setAddMenu(false)}>
          <div className="zoom-in w-full max-w-md rounded-3xl p-4" style={{ background: C.blanc }}
            onClick={(e) => e.stopPropagation()}>
            <button onClick={() => { setAddMenu(false); setLibOpen(true); }}
              className="w-full rounded-2xl py-4 text-base font-extrabold" style={{ background: C.violet, color: "#fff" }}>
              {t.addFromLib}
            </button>
            <button onClick={() => {
              const id = uid();
              setTasks((ts) => [...ts, {
                id, img: "custom", points: 10, freq: "daily",
                days: [], moments: ["any"], assign: "house", label: t.newTask,
              }]);
              setAddMenu(false);
              setTaskView("list");
              setOpenTask(id);
            }}
              className="mt-2 w-full rounded-2xl py-4 text-base font-extrabold" style={{ background: C.orange, color: "#fff" }}>
              {t.createTask}
            </button>
            <button onClick={() => setAddMenu(false)}
              className="mt-2 w-full rounded-2xl py-3 text-sm font-extrabold" style={{ background: C.gris, color: C.encreDoux }}>
              {t.cancel}
            </button>
          </div>
        </div>
      )}

      {/* la liste toute prête, ouverte depuis le + */}
      {libOpen && (
        <div className="fade-in fixed inset-0 z-40 flex flex-col" style={{ background: C.gris }}>
          <div className="flex items-center gap-3 px-4 pb-3 pt-5" style={{ background: C.blanc }}>
            <h2 className="flex-1 text-lg font-black" style={{ fontFamily: "Nunito, Assistant, sans-serif" }}>
              {t.addFromLib}
            </h2>
            <button onClick={() => setLibOpen(false)}
              className="rounded-full px-4 py-2 text-sm font-extrabold"
              style={{ background: C.turquoise, color: "#fff" }}>
              {t.close}
            </button>
          </div>

          <div className="flex-1 overflow-y-auto px-4 pb-8 pt-4">
            {CAT_ORDER.map((cat) => (
              <div key={cat} className="mb-5">
                <p className="mb-2 text-[11px] font-extrabold uppercase tracking-[0.14em]" style={{ color: C.violet }}>
                  {CATS[cat][lang]}
                </p>
                <div className="flex flex-col gap-2">
                  {CATALOG.filter((c) => c.cat === cat).map((c) => {
                    const on = tasks.some((x) => x.id === c.id);
                    return (
                      <div key={c.id} className="flex items-center gap-3 rounded-2xl p-2" style={{ background: C.blanc }}>
                        <div className="h-12 w-12 shrink-0 overflow-hidden rounded-xl" style={{ background: C.gris }}>
                          <img src={IMG[c.img]} alt="" className="h-full w-full object-cover" />
                        </div>
                        <div className="flex-1">
                          <span className="block text-[15px] font-bold leading-tight">{c[lang]}</span>
                          <span className="text-[11px] font-bold" style={{ color: C.encreDoux }}>
                            {c.freq === "daily" ? t.freqDaily : c.freq === "weekly" ? t.freqWeekly : t.freqDays}
                            {` · ${c.points} ${t.points}`}
                          </span>
                        </div>
                        <button
                          onClick={() => {
                            if (on) { setTasks((ts) => ts.filter((x) => x.id !== c.id)); return; }
                            /* ajoutée : on referme et on ouvre sa fiche pour
                               régler la récurrence tout de suite */
                            setTasks((ts) => [...ts, fromCatalog(c)]);
                            setLibOpen(false);
                            setTaskView("list");
                            setOpenTask(c.id);
                          }}
                          className="rounded-full px-4 py-2 text-xs font-extrabold transition active:scale-95"
                          style={{ background: on ? C.turquoise : C.gris, color: on ? "#fff" : C.encreDoux }}>
                          {on ? "✓" : "+"}
                        </button>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      <input ref={mediaRef} type="file" accept="image/*,video/*" multiple
        onChange={addMedia} style={{ display: "none" }} />

      {err && (
        <div className="fixed inset-x-4 bottom-24 z-40 rounded-2xl px-4 py-3 text-sm font-bold"
          style={{ background: C.orange, color: "#fff" }}>{err}</div>
      )}

      {!needsSetup && (
        <nav className="fixed inset-x-0 bottom-0 z-20 mx-auto flex max-w-md justify-around px-3 pb-4 pt-2"
          style={{ background: `linear-gradient(to top, ${C.gris} 76%, transparent)` }}>
          {[
            { id: "home", text: t.home, col: C.turquoise },
            { id: "tasks", text: t.tasks, col: C.turquoise },
            { id: "settings", text: t.settings, col: C.orange },
          ].map((s) => {
            const on = tab === s.id;
            return (
              <button key={s.id} onClick={() => setTab(s.id)}
                className="flex flex-1 items-center justify-center rounded-2xl py-2.5 transition"
                style={{ background: on ? s.col : C.blanc, color: on ? "#fff" : C.encreDoux, marginInline: 3 }}>
                <span className="text-[12px] font-extrabold">{s.text}</span>
              </button>
            );
          })}
        </nav>
      )}
    </div>
  );

  /* sélecteur d'avatar : gouttes colorées, figurines, ou photo */
  function AvatarPicker() {
    return (
      <div>
        <div className="mb-2 flex items-center gap-2">
          <Avatar a={draftAvatar} size={44} />
          <div className="flex flex-1 gap-1.5">
            {[["drops", t.drops], ["figures", t.figures], ["photo", t.photo]].map(([k, lb]) => (
              <button key={k} onClick={() => { setAvatarTab(k); if (k === "photo") fileRef.current?.click(); }}
                className="flex-1 rounded-xl py-1.5 text-[11px] font-extrabold"
                style={{ background: avatarTab === k ? C.violet : C.gris, color: avatarTab === k ? "#fff" : C.encreDoux }}>
                {lb}
              </button>
            ))}
          </div>
        </div>

        <input ref={fileRef} type="file" accept="image/*" onChange={pickPhoto} style={{ display: "none" }} />

        {avatarTab === "drops" && (
          <div className="flex flex-wrap gap-2">
            {DROPS.map((c) => (
              <button key={c} onClick={() => setDraftAvatar({ type: "drop", value: c })}
                className="rounded-xl p-1"
                style={{ background: C.gris, outline: draftAvatar.value === c ? `2.5px solid ${C.encre}` : "none" }}>
                <Goutte color={c} size={26} />
              </button>
            ))}
          </div>
        )}

        {avatarTab === "figures" && (
          <div className="flex flex-wrap gap-2">
            {EMOJIS.map((e) => (
              <button key={e} onClick={() => setDraftAvatar({ type: "emoji", value: e })}
                className="rounded-xl px-2 py-1 text-2xl"
                style={{ background: C.gris, outline: draftAvatar.value === e ? `2.5px solid ${C.encre}` : "none" }}>
                {e}
              </button>
            ))}
          </div>
        )}

        {avatarTab === "photo" && (
          <button onClick={() => fileRef.current?.click()}
            className="w-full rounded-2xl py-3 text-sm font-extrabold"
            style={{ background: C.gris, color: C.encreDoux }}>
            {t.photo}
          </button>
        )}
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
